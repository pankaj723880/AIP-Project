<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <div class="welcome-header">
                <i class="fas fa-graduation-cap"></i>
                <h1>Welcome to Online Quiz System</h1>
                <p class="subtitle">Test your knowledge with our interactive quizzes</p>
            </div>

            <div class="welcome-actions">
                <a href="login.jsp" class="action-button primary">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </a>
                <a href="register.jsp" class="action-button">
                    <i class="fas fa-user-plus"></i>
                    Register
                </a>
                <a href="quiz" class="action-button accent">
                    <i class="fas fa-play-circle"></i>
                    Take Quiz
                </a>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fas fa-brain"></i>
                    <h3>Test Your Knowledge</h3>
                    <p>Challenge yourself with various topics</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-chart-line"></i>
                    <h3>Track Progress</h3>
                    <p>Monitor your performance over time</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-trophy"></i>
                    <h3>Earn Achievements</h3>
                    <p>Get rewarded for your success</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
